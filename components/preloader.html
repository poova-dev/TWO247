<!-- ========================================================================= -->
<!-- TWO247 3D LOGO PRELOADER -->
<!-- ========================================================================= -->
<div id="two247-preloader" aria-label="Loading TWO247 Experience" role="status">
  
  <!-- Skip Button (Accessible & Convenient) -->
  <button id="preloader-skip" class="absolute top-6 right-6 text-xs uppercase tracking-widest text-slate-400 hover:text-white px-3 py-1 rounded-full border border-slate-700 hover:border-slate-500 transition-colors z-30" aria-label="Skip preloader">
    Skip ✕
  </button>

  <div class="relative flex flex-col items-center justify-center p-6 text-center max-w-sm w-full">
    
    <!-- 3D Orbital Gyroscope & Owl Emblem Container -->
    <div class="relative w-44 h-44 flex items-center justify-center mb-8 perspective-[1000px]">
      
      <!-- Outer 3D Gyro Ring -->
      <div class="preloader-orbit-ring-outer"></div>

      <!-- Inner 3D Orbit Ring with Traveling Plane -->
      <div class="preloader-orbit-ring">
        <!-- 3D Orbiting Airplane (Derived from official logo swoosh) -->
        <div class="orbiting-airplane">
          <svg class="w-6 h-6 text-brand-orange fill-current" viewBox="0 0 24 24">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
          </svg>
        </div>
      </div>

      <!-- Centerpiece: White Owl Logo with Glowing 24/7 Eyes -->
      <div class="relative z-10 w-24 h-24 p-3 rounded-full bg-brand-navy/90 border border-slate-700/80 shadow-2xl flex items-center justify-center">
        <!-- SVG Owl Mark with Glowing Eyes -->
        <svg viewBox="0 0 48 48" fill="none" class="w-full h-full drop-shadow-md">
          <circle cx="24" cy="24" r="21" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="85 45" stroke-linecap="round" />
          <path d="M12 16C12 12 18 10 24 15C30 10 36 12 36 16C36 28 29 36 24 38C19 36 12 28 12 16Z" fill="#071A2B" stroke="#F59E0B" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M14 17C17 14 22 17 24 20C26 17 31 14 34 17" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          
          <!-- Eyes with pulsing glow -->
          <g class="preloader-owl-eyes">
            <circle cx="18" cy="22" r="3.4" fill="#F59E0B" />
            <circle cx="18" cy="22" r="1.4" fill="#071A2B" />
            <circle cx="18.8" cy="21.2" r="0.6" fill="#FFFFFF" />

            <circle cx="30" cy="22" r="3.4" fill="#F59E0B" />
            <circle cx="30" cy="22" r="1.4" fill="#071A2B" />
            <circle cx="30.8" cy="21.2" r="0.6" fill="#FFFFFF" />
          </g>

          <polygon points="24,23 26,27 24,31 22,27" fill="#F59E0B" />
        </svg>
      </div>

    </div>

    <!-- Brand Typography Lockup -->
    <div class="space-y-1 mb-6">
      <h2 class="text-3xl font-black tracking-tight text-white preloader-shimmer-text">
        TWO<span class="text-brand-orange">247</span>
      </h2>
      <p class="text-[11px] uppercase tracking-[0.25em] text-slate-300 font-semibold">
        The White Owl Holidays
      </p>
      <p class="text-[10px] text-brand-orange/90 tracking-widest uppercase font-bold">
        24/7 Travel Assistance
      </p>
    </div>

    <!-- Loading Bar & Percent -->
    <div class="w-full max-w-[200px] space-y-2">
      <div class="h-1 w-full bg-slate-800 rounded-full overflow-hidden border border-slate-700/50">
        <div id="preloader-progress-bar" class="h-full bg-gradient-to-r from-brand-orange to-amber-300 rounded-full transition-all duration-75 w-0"></div>
      </div>
      <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400">
        <span id="preloader-status" class="transition-all duration-200">Calibrating 24/7 navigation...</span>
        <span id="preloader-percent" class="text-brand-orange font-bold font-mono">0%</span>
      </div>
    </div>

  </div>
</div>
